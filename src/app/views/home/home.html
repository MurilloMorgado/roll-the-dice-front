<app-header></app-header>
<main>

  <section class="section-one">

    <div class="titulo">
      <h1>Select Die</h1>
    </div>

    <div class="section-die">
      <div class="card flex justify-center botao" *ngFor="let dado of dados">
        <img src="d4.png" alt="" (onClick)="selecionarDado(dado.lados)">
      </div>

    </div>
    <div class="roll">
      <p-button>Roll</p-button>
    </div>

  </section>

  <section class="section-two">

    <div class="pergaminho">

      <p-table [value]="historicoRolagem" [scrollable]="true" scrollHeight="350px" [tableStyle]="{'min-width': '50rem'}"
        class="rpg-table">

        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Lado</th>
            <th>Resultado</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-historicoRolagem>
          <tr>
            <td>{{historicoRolagem.id}}</td>
            <td>{{historicoRolagem.lado}}</td>
            <td>{{historicoRolagem.resultado}}</td>
          </tr>
        </ng-template>

      </p-table>


    </div>

  </section>

</main>

<app-footer></app-footer>
